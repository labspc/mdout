name: Deploy GitHub Pages

on:
  push:
    branches: [main, blog]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref_name == vars.PAGES_BRANCH || (vars.PAGES_BRANCH == '' && github.ref_name == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: zola@0.23.4
      - id: site
        name: Resolve site URL
        env:
          CONFIGURED_SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -n "$CONFIGURED_SITE_URL" ]; then
            site_url="$CONFIGURED_SITE_URL"
          else
            owner="${GITHUB_REPOSITORY%%/*}"
            repo="${GITHUB_REPOSITORY#*/}"
            if [ "$repo" = "${owner}.github.io" ]; then
              site_url="https://${owner}.github.io/"
            else
              site_url="https://${owner}.github.io/${repo}/"
            fi
          fi
          echo "site_url=$site_url" >> "$GITHUB_OUTPUT"
      - run: cargo test --locked
      - run: cargo run --locked -- check
      - run: scripts/verify-fixture.sh
      - run: cargo run --locked -- build --base-url "${{ steps.site.outputs.site_url }}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
