name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: zola@0.23.4
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo run --locked -- doctor
      - run: cargo run --locked -- check
      - run: scripts/verify-fixture.sh
      - run: scripts/verify-scaffold.sh
      - run: cargo run --locked -- build --base-url https://example.com/
