name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: zola@0.23.4
      - name: Verify tag matches Cargo version
        run: |
          crate_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [ "v${crate_version}" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo version $crate_version" >&2
            exit 1
          fi
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo publish --dry-run --locked
      - run: cargo run --locked -- doctor
      - run: cargo run --locked -- check
      - run: scripts/verify-fixture.sh
      - run: scripts/verify-scaffold.sh
      - run: cargo run --locked -- build --base-url https://example.com/

  cli:
    name: CLI (${{ matrix.target }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package Unix CLI
        if: runner.os != 'Windows'
        shell: bash
        run: |
          package="mdout-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$package"
          cp "target/${{ matrix.target }}/release/mdout" "$package/"
          cp README.md LICENSE THIRD_PARTY_NOTICES "$package/"
          tar -czf "${package}.tar.gz" "$package"
      - name: Package Windows CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $package = "mdout-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $package
          Copy-Item "target/${{ matrix.target }}/release/mdout.exe" "$package/"
          Copy-Item README.md, LICENSE, THIRD_PARTY_NOTICES "$package/"
          Compress-Archive -Path $package -DestinationPath "$package.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: mdout-${{ matrix.target }}
          path: mdout-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error

  release:
    needs: cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Package full source
        run: |
          package="mdout-${GITHUB_REF_NAME}-source"
          git archive \
            --format=tar.gz \
            --prefix="${package}/" \
            --output="artifacts/${package}.tar.gz" \
            "$GITHUB_REF_NAME"
          cd artifacts
          sha256sum * > SHA256SUMS
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            artifacts/* \
            --verify-tag \
            --generate-notes \
            --title "mdout $GITHUB_REF_NAME"
