name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: zola@0.23.4
      - run: cargo install mdout --version 0.2.0 --locked
      - run: mdout doctor
      - run: mdout check
      - run: mdout build --base-url https://example.com/
