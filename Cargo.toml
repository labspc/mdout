[package]
name = "mdout"
version = "0.1.0"
edition = "2024"
description = "Markdown in, HTML out. Built on Zola."
license = "MIT"
repository = "https://github.com/labspc/mdout"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.47", features = ["macros", "rt-multi-thread"] }
walkdir = "2.5"

[dev-dependencies]
tempfile = "3.20"
